name: Windows Release Build

# Builds a ready-to-run Windows package (demo .exe + resources) so recruiters
# can download and double-click without installing a compiler.
#   - Every push to main / manual run: uploads a downloadable build artifact.
#   - Pushing a version tag (e.g. v1.0.0): also attaches the zip to a GitHub Release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/demo.exe package/AI-BoardGames.exe
          Copy-Item -Recurse resources package/resources
          Compress-Archive -Path package/* -DestinationPath AI-BoardGames-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-BoardGames-Windows-x64
          path: AI-BoardGames-Windows-x64.zip

      - name: Attach to Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AI-BoardGames-Windows-x64.zip
